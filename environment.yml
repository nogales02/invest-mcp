# Geospatial sidecar environment for invest-mcp.
#
# The MCP server itself runs on a plain Python 3.14 venv (mcp + pydantic only).
# Anything that needs GDAL -- the geospatial preflight, and later the data-prep
# routines (reproject / clip / align) -- runs in THIS conda env, invoked by the
# server as a subprocess:  <env>\python.exe -m invest_mcp.geo.preflight ...
#
# Create:   conda env create -f environment.yml
# Update:   conda env update -f environment.yml --prune
name: invest-geo
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - gdal
  - rasterio
  - pyproj
  - shapely
  - pyogrio
  - numpy
  - pygeoprocessing
  - pip
