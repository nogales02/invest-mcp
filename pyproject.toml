[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-mcp"
version = "0.1.0"
description = "MCP server to drive Natural Capital Project InVEST models via natural language"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Nogales" }]
keywords = ["mcp", "invest", "natcap", "ecosystem-services", "geospatial"]
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.urls]
Repository = "https://github.com/nogales02/invest-mcp"

[project.optional-dependencies]
http = ["uvicorn>=0.30"]          # only needed for --transport streamable-http / sse
dev = ["pytest>=8"]

[project.scripts]
invest-mcp = "invest_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invest_mcp = [
    "knowledge/coefficients/*.json",
    "knowledge/coefficients/*.md",
    "knowledge/coefficients/profiles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
